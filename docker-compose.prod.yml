services:
  cognee:
    container_name: cognee-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      - ENVIRONMENT=prod
      - DEBUG=false
      - HOST=0.0.0.0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - cognee_data:/app/cognee/.data_storage
    networks:
      - cognee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4GB

  arq-worker:
    container_name: cognee-worker
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.prod
    entrypoint: ["python", "-m", "arq", "cognee.infrastructure.pipeline_queue.arq_worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cognee_data:/app/cognee/.data_storage
    networks:
      - cognee-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4GB

  postgres:
    image: pgvector/pgvector:pg17
    container_name: cognee-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-cognee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cognee}
      POSTGRES_DB: ${DB_NAME:-cognee_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cognee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cognee} -d ${DB_NAME:-cognee_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4GB

  neo4j:
    image: neo4j:5.26
    container_name: cognee-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${GRAPH_DATABASE_USERNAME:-neo4j}/${GRAPH_DATABASE_PASSWORD:-cognee_graph_2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - cognee-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${GRAPH_DATABASE_USERNAME:-neo4j} -p ${GRAPH_DATABASE_PASSWORD:-cognee_graph_2024} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4GB

  redis:
    image: redis:7-alpine
    container_name: cognee-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cognee-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512MB

networks:
  cognee-network:
    name: cognee-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  cognee_data:
